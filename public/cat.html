<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pawse</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        cursor: none;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <video id="cat" src="/neko1.webm" autoplay muted playsinline></video>
    <script>
      const v = document.getElementById("cat");
      let phase = "intro";
      v.addEventListener("ended", () => {
        if (phase === "intro") {
          phase = "loop";
          v.src = "/neko2.webm";
          v.loop = true;
          v.play().catch(() => {});
        }
      });
    </script>
  </body>
</html>
