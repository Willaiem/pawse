<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pawse — snooze</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #1f1f23;
        color: #f5f5f7;
        user-select: none;
      }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 20px 22px;
        box-sizing: border-box;
        gap: 14px;
      }
      .title { font-size: 15px; font-weight: 600; }
      .body { font-size: 13px; opacity: 0.85; line-height: 1.45; flex: 1; }
      .row { display: flex; gap: 10px; justify-content: flex-end; }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .primary { background: #6c8cff; color: #fff; }
      .primary:hover { background: #8aa1ff; }
      .secondary {
        background: transparent;
        color: #f5f5f7;
        border-color: rgba(255, 255, 255, 0.2);
      }
      .secondary:hover { background: rgba(255, 255, 255, 0.08); }
      @media (prefers-color-scheme: light) {
        html, body { background: #fafafa; color: #1c1c1e; }
        .secondary { color: #1c1c1e; border-color: rgba(0, 0, 0, 0.18); }
        .secondary:hover { background: rgba(0, 0, 0, 0.05); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Pause tracking?</div>
      <div class="body">pawse will stop counting your tracked apps for 30 minutes. The cat won't appear during that time.</div>
      <div class="row">
        <button id="cancel" class="secondary" type="button">Cancel</button>
        <button id="confirm" class="primary" type="button" autofocus>Snooze 30 min</button>
      </div>
    </div>
    <script>
      (function () {
        function getCurrent() {
          const t = window.__TAURI__;
          if (!t) return null;
          if (t.webviewWindow && typeof t.webviewWindow.getCurrentWebviewWindow === "function") {
            return t.webviewWindow.getCurrentWebviewWindow();
          }
          if (t.window && typeof t.window.getCurrentWindow === "function") {
            return t.window.getCurrentWindow();
          }
          return null;
        }
        async function closeSelf() {
          const w = getCurrent();
          if (w && typeof w.close === "function") {
            try { await w.close(); return; } catch (e) { console.error("close failed:", e); }
          }
          if (window.__TAURI__ && window.__TAURI__.core) {
            try { await window.__TAURI__.core.invoke("close_snooze_window"); return; }
            catch (e) { console.error("close_snooze_window failed:", e); }
          }
        }
        async function confirmSnooze() {
          if (window.__TAURI__ && window.__TAURI__.core) {
            try { await window.__TAURI__.core.invoke("snooze", { seconds: 30 * 60 }); }
            catch (e) { console.error("snooze failed:", e); }
          }
          await closeSelf();
        }
        document.getElementById("cancel").addEventListener("click", closeSelf);
        document.getElementById("confirm").addEventListener("click", confirmSnooze);
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeSelf();
          if (e.key === "Enter") confirmSnooze();
        });
      })();
    </script>
  </body>
</html>
